<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} &middot; Beyza Bozdag</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">

<meta property="og:type" content="article">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 200 }}">
<meta property="og:image" content="{{ page.image | default: '/images/beyza_hero.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@nbbozdag">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 200 }}">
<meta name="twitter:image" content="{{ page.image | default: '/images/beyza_hero.jpg' | absolute_url }}">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D9622B'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='600' fill='%23FFFBF5' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --bg: #FFFBF5;
    --surface: #FFF6EA;
    --text: #2A2018;
    --text-secondary: #8A7666;
    --accent: #D9622B;
    --accent-2: #C1442D;
    --accent-light: #FBEEDD;
    --border: #EFDFC9;
    --max-w: 680px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent-light); }
  a { color: var(--accent); }

  .post-wrap { max-width: var(--max-w); margin: 0 auto; padding: 56px 24px 80px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    text-decoration: none;
    margin-bottom: 36px;
  }
  .back-link:hover { color: var(--accent); }

  .post-meta {
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent-2);
    margin-bottom: 10px;
  }

  .post-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .post-tags span {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 4px 11px;
    border-radius: 20px;
    background: var(--surface);
    color: var(--accent-2);
    border: 1px solid var(--border);
  }

  .post-content { margin-top: 36px; }

  .post-content h1 {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.4px;
    line-height: 1.25;
    margin-bottom: 18px;
  }
  .post-content h2 {
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 600;
    margin: 38px 0 14px;
  }
  .post-content h3 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    margin: 28px 0 10px;
  }
  .post-content p { margin-bottom: 18px; color: var(--text); }
  .post-content ul, .post-content ol { margin: 0 0 18px 22px; }
  .post-content li { margin-bottom: 6px; }
  .post-content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  .post-content blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 18px;
    color: var(--text-secondary);
    margin: 0 0 18px;
  }
  .post-content code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .post-content pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    overflow-x: auto;
    margin-bottom: 18px;
  }
  .post-content pre code { background: none; padding: 0; }
  .post-content figure { margin: 28px 0; }
  .post-content img {
    max-width: 100%;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
  }
  .post-content figcaption {
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
    margin-top: 8px;
  }
  .post-content a { font-weight: 500; }
  .post-content a:hover { text-decoration: none; border-bottom: 1px solid var(--accent); }

  footer {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 32px 24px 60px;
    font-size: 12.5px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent-2); font-weight: 500; }
</style>
</head>
<body>

<div class="post-wrap">
  <a class="back-link" href="/#blog">&larr; Back to homepage</a>

  <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
  <div class="post-tags">
    {% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}
  </div>
  {% endif %}
</div>

<footer>
  Written by <a href="/">Beyza Bozdag</a>
</footer>

</body>
</html>
